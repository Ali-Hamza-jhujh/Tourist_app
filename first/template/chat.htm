{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat with {{ receiver.username }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans h-screen flex flex-col">

  <!-- Header -->
  <div class="flex items-center p-4 bg-white shadow-md">
    <a href="{% url 'chat_list' %}" class="mr-4 text-gray-500 text-xl">&#8592;</a>
    <div class="flex items-center space-x-4">
      <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center text-white font-bold">
        {{ receiver.username|slice:":1" }}
      </div>
      <div>
        <div class="font-semibold">{{ receiver.username }}</div>
        <div class="text-sm text-green-500">Online</div>
      </div>
    </div>
  </div>

  <!-- Chat Container -->
  <div id="chatcontainer" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50">
    <!-- Messages will load here -->
  </div>

  <!-- Input Box -->
  <div class="flex p-3 bg-white shadow-md">
    <input type="hidden" id="user-id" value="{{ request.user.id }}">
    <input type="hidden" id="receiver-id" value="{{ receiver.id }}">
    <input id="messageInput" type="text" placeholder="Type a message..." autocomplete="off"
      class="flex-1 border rounded-full px-4 py-2 mr-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
    <button id="sendBtn" class="bg-blue-500 text-white px-4 py-2 rounded-full hover:bg-blue-600">Send</button>
  </div>

  <!-- JS -->
  <script src="{% static 'chat.js' %}"></script>
</body>
</html>
