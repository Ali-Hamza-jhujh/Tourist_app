<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chat App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  {% load static %}
  <link rel="stylesheet" href="{% static 'chatapp/chat.css' %}">
</head>
<body class="bg-gray-100">
  <header class="bg-blue-600 text-white p-3 flex justify-between">
    <div class="font-bold">ChatApp</div>
    <div>
      {% if user.is_authenticated %}
        <span class="mr-4">Logged as: {{ user.username }}</span>
        <a href="{% url 'logout_page' %}" class="underline">Logout</a>
      {% else %}
        <a href="{% url 'login_page' %}" class="underline">Login</a>
      {% endif %}
    </div>
  </header>
  <main class="p-4">
    {% block content %}{% endblock %}
  </main>
  <script src="{% static 'chatapp/chat.js' %}"></script>
</body>
</html>
