{% extends 'base.htm' %}
{% block title %}Register page{% endblock %}
{% block content %}

<div class="container" style="max-width: 600px; margin: 70px auto; background: #f9f9f9; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); padding: 30px;">
  
  <h1 style="text-align: center; margin-bottom: 30px;">Sign Up</h1>

  <form method="post">
    {% csrf_token %}
    
    <div class="form-group" style="margin-bottom: 15px;">
      <label for="firstname">First Name</label>
      <input type="text" name="first_name" id="firstname" class="form-control" required style="width: 100%; padding: 10px;">
    </div>

    <div class="form-group" style="margin-bottom: 15px;">
      <label for="lastname">Last Name</label>
      <input type="text" name="last_name" id="lastname" class="form-control" required style="width: 100%; padding: 10px;">
    </div>

    <div class="form-group" style="margin-bottom: 15px;">
      <label for="fathername">Father Name</label>
      <input type="text" name="father_name" id="fathername" class="form-control" required style="width: 100%; padding: 10px;">
    </div>

    <div class="form-group" style="margin-bottom: 15px;">
      <label for="username">Username</label>
      <input type="text" name="username" id="username" class="form-control" required style="width: 100%; padding: 10px;">
    </div>

    <div class="form-group" style="margin-bottom: 15px;">
      <label for="email">Email</label>
      <input type="email" name="email" id="email" class="form-control" required style="width: 100%; padding: 10px;">
    </div>

    <div class="form-group" style="margin-bottom: 15px;">
      <label for="password">Password</label>
      <input type="password" name="password" id="password" class="form-control" required style="width: 100%; padding: 10px;">
    </div>
   <p>Already have an account,Click here <a href="{% url 'login_page' %}">Sign In</a></p>
    <div style="text-align: center; margin-top: 20px;">
      <button type="submit" class="btn btn-success" style="padding: 10px 25px;">Sign Up</button>
    </div>
  </form>
</div>
{% endblock %}
