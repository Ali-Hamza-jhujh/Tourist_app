<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chatbot</title>
    <style>
        body { font-family: Arial; background: #f2f2f2; padding: 20px; }
        #chat { width: 500px; max-width: 100%; margin: auto; background: white; padding: 20px; border-radius: 10px; }
        .message { margin-bottom: 10px; }
        .user { color: blue; }
        .bot { color: green; }
    </style>
</head>
<body>
    <div id="chat">
        <div id="messages"></div>
        <input type="text" id="messageInput" placeholder="Type your message..." style="width: 80%;">
        <button id="sendBtn">Send</button>
    </div>

    <script>
        const input = document.getElementById("messageInput");
        const button = document.getElementById("sendBtn");
        const container = document.getElementById("messages");

        button.addEventListener("click", sendMessage);
        input.addEventListener("keyup", function(e) { 
            if(e.key === "Enter") sendMessage(); 
        });

        async function sendMessage() {
            const message = input.value.trim();
            if (!message) return;

            // Show user message
            container.innerHTML += `<div class="message user"><b>You:</b> ${message}</div>`;
            input.value = "";

            try {
                const res = await fetch("/chatbot-api/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message })
                });

                const data = await res.json();

                // Show bot reply
                container.innerHTML += `<div class="message bot"><b>Bot:</b> ${data.reply}</div>`;
                container.scrollTop = container.scrollHeight;
            } catch(err) {
                container.innerHTML += `<div class="message bot"><b>Bot:</b> Error: ${err}</div>`;
            }
        }
    </script>
</body>
</html>
