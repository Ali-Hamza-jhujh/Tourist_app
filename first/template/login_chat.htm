{% load static %}
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Login</title>
  <link rel="stylesheet" href="{% static 'chat.css' %}">
  <style>
    body{display:grid;place-items:center;height:100vh;background:#f7f7f7;margin:0}
    form{background:#fff;padding:24px;border-radius:12px;min-width:300px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
    label{display:block;margin:8px 0 4px}
    input{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px}
    button{margin-top:12px;padding:10px 14px}
  </style>
</head>
<body>
  <form method="post">{% csrf_token %}
    <h3>Sign in</h3>
    {{ form.non_field_errors }}
    <label>Username</label>
    {{ form.username }}
    <label>Password</label>
    {{ form.password }}
    <button type="submit">Login</button>
  </form>
</body>
</html>
