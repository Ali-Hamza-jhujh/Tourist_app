{% extends "base.html" %}
{% block content %}
<h2 class="text-xl font-bold mb-4">User List</h2>
<ul>
    {% for user in users %}
        <li class="mb-2 flex justify-between items-center">
            <a href="{% url 'tourism:chat_room' user.id %}" class="text-blue-600 hover:underline">{{ user.username }}</a>
            <span class="ml-2 text-sm {{ user.id|stringformat:"s" in online_users|join:"," and 'text-green-600' or 'text-gray-400'}}">
                {{ user.id|stringformat:"s" in online_users|join:","|yesno:"Online,Offline" }}
            </span>
        </li>
    {% empty %}
        <li>No other users found.</li>
    {% endfor %}
</ul>
{% endblock %}
