{% extends 'base.htm' %}
{% block title %}Login{% endblock %}
{% block content %}

<div style="display: flex; align-items: center; justify-content: center;">
  <div class="container" style="background-color: #f9f9f9; max-width: 600px; width: 100%; box-shadow: 0 0 13px rgba(0,0,0,0.1); padding: 30px; margin: 70px auto; border-radius: 10px;">

    <h1 style="text-align: center; margin-bottom: 30px;">Sign In</h1>

    <form method="post">
      {% csrf_token %}

      <div class="form-group" style="margin-bottom: 15px;">
        <label for="username">Username</label>
        <input type="text" name="username" id="username" required style="width: 100%; padding: 10px;">
      </div>

      <div class="form-group" style="margin-bottom: 15px;">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" required style="width: 100%; padding: 10px;">
      </div>
    <p>Don’t have an account,Click here <a href="{% url 'register_page' %}">Sign Up</a></p>
      <div style="text-align: center; margin-top: 15px;">
        <button type="submit" class="btn btn-success" style="padding: 10px 20px;">Sign In</button>
      </div>

    </form>
  </div>
</div>
{% endblock %}
